<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Vercel TS</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    input, button { font-size: 1rem; padding: .5rem; }
    pre { background: #f4f4f4; padding: 1rem; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Mini proyecto Vercel + TS</h1>
  <input id="name" placeholder="Tu nombre">
  <button id="btn">Llamar a /api/hello</button>
  <pre id="out">…</pre>

  <h2>Enviar a n8n</h2>
  <input id="msg" placeholder="Mensaje para n8n">
  <button id="btn-n8n">Enviar a /api/n8n</button>
  <pre id="out-n8n">…</pre>
  <script>
    document.getElementById("btn").onclick = async () => {
      const name = encodeURIComponent(document.getElementById("name").value || "mundo");
      const out = document.getElementById("out");
      out.textContent = "Cargando…";
      try {
        const res = await fetch(`/api/hello?name=${name}`);
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}: ${await res.text()}`);
        out.textContent = JSON.stringify(await res.json(), null, 2);
      } catch (err) {
        out.textContent = `Error: ${err.message}`;
      }
    };

    document.getElementById("btn-n8n").onclick = async () => {
      const out = document.getElementById("out-n8n");
      out.textContent = "Enviando…";
      try {
        const res = await fetch("/api/n8n", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mensaje: document.getElementById("msg").value, enviadoEn: new Date().toISOString() }),
        });
        out.textContent = JSON.stringify(await res.json(), null, 2);
      } catch (err) {
        out.textContent = `Error: ${err.message}`;
      }
    };
  </script>
</body>
</html>
